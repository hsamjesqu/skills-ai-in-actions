name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  analyze:
    name: Issue Completeness Check
    runs-on: ubuntu-latest
    steps:
      - name: Check issue for missing details
        id: check
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          body_lower=$(printf '%s' "${ISSUE_BODY}" | tr '[:upper:]' '[:lower:]')

          if [[ ${#ISSUE_BODY} -lt 50 ]]; then
            missing+=("A more detailed description of the problem (the current one is very short).")
          fi
          if ! grep -Eq 'step|reproduce|when i|after i' <<< "$body_lower"; then
            missing+=("Steps to reproduce the issue.")
          fi
          if ! grep -Eq 'expected|should' <<< "$body_lower"; then
            missing+=("What you expected to happen.")
          fi
          if ! grep -Eq 'actual|instead|error|got|getting|throwing' <<< "$body_lower"; then
            missing+=("What actually happened, including any error message.")
          fi
          if ! grep -Eq 'browser|chrome|safari|firefox|ios|android|windows|macos|linux|version|device' <<< "$body_lower"; then
            missing+=("Environment details (device, OS, browser, app version).")
          fi

          delimiter="ghadelimiter_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          {
            echo "response<<${delimiter}"
            if [[ ${#missing[@]} -eq 0 ]]; then
              echo "Thanks @${ISSUE_AUTHOR}! This issue looks complete and ready for triage."
            else
              echo "Thanks for opening this issue, @${ISSUE_AUTHOR}! A few details would help us resolve it faster:"
              echo
              for item in "${missing[@]}"; do
                echo "- ${item}"
              done
              echo
              echo "Please update the issue with these details when you can."
            fi
            echo
            echo "_Automated completeness check_"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.check.outputs.response }}
