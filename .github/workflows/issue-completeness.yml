name: Issue Completeness

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  analyze:
    name: AI Issue Completeness
    runs-on: ubuntu-latest

    steps:
      - name: Analyze issue with GitHub Models
        id: ai-response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        shell: bash
        run: |
          set -euo pipefail

          prompt=$(
            printf '%s\n' \
              "New issue was opened by ${ISSUE_AUTHOR}" \
              "Title: ${ISSUE_TITLE}" \
              "Body:" \
              "---" \
              "${ISSUE_BODY}" \
              "---"
          )

          response=$(
            jq -n \
              --arg system 'You are a GitHub issue assistant. Your task is to analyze newly opened issues for completeness. Provide concise, helpful suggestions, ask clarifying questions, and identify any missing information that would help resolve the issue faster. Always respond with ready-to-use markdown content with no code blocks. Sign off as AI assistant.' \
              --arg prompt "$prompt" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  {
                    role: "system",
                    content: $system
                  },
                  {
                    role: "user",
                    content: $prompt
                  }
                ],
                temperature: 0.7,
                max_tokens: 500
              }' |
            curl --fail-with-body --silent --show-error \
              -X POST \
              "https://api.openai.com/v1/chat/completions" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -H "Content-Type: application/json" \
              --data @-
          )

          message=$(printf '%s' "$response" | jq -er '.choices[0].message.content')

          delimiter="ghadelimiter_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"

          {
            echo "response<<${delimiter}"
            printf '%s\n' "$message"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Comment results on the issue
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: ${{ steps.ai-response.outputs.response }}
